name: Publish versioned archive

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and metadata
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node bin/pfx-release.mjs check
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT_VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("version.json","utf8")).version')"
          test "$TAG_VERSION" = "$CURRENT_VERSION"
      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist
          sha256sum -- *.tgz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS.txt --title "PFx Release Core $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
